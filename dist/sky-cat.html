<script>
/* Sky Cat engine: canvas, loop, input, sprites, masks, text, fx, storage, rng, scenes. */
(function () {
'use strict';

const SC = window.SC = window.SC || {};
const W = 480, H = 270;
SC.W = W; SC.H = H;
SC.frame = 0; SC.time = 0; SC.dt = 1; SC.current = null;

// ---------------------------------------------------------------- utils
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(x0, y0, x1, y1) { const dx = x1 - x0, dy = y1 - y0; return Math.sqrt(dx * dx + dy * dy); }
function angle(x0, y0, x1, y1) { return Math.atan2(y1 - y0, x1 - x0); }
function hash(str) {
  str = String(str);
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rng(seed) {
  let a = (seed === undefined || seed === null ? (Math.random() * 4294967296) : seed) >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function choose(arr, rnd) { return arr[Math.floor((rnd || Math.random)() * arr.length)]; }

SC.clamp = clamp; SC.lerp = lerp; SC.dist = dist; SC.angle = angle;
SC.hash = hash; SC.rng = rng; SC.rand = Math.random; SC.choose = choose;
SC.ease = {
  linear: function (t) { return t; },
  inQuad: function (t) { return t * t; },
  outQuad: function (t) { return 1 - (1 - t) * (1 - t); },
  inCubic: function (t) { return t * t * t; },
  outCubic: function (t) { const u = 1 - t; return 1 - u * u * u; },
  outBack: function (t) { const c1 = 1.70158, c3 = c1 + 1, u = t - 1; return 1 + c3 * u * u * u + c1 * u * u; },
  inOutSine: function (t) { return -(Math.cos(Math.PI * t) - 1) / 2; },
  outElastic: function (t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
  }
};

// ---------------------------------------------------------------- flags
(function () {
  let loc = '';
  try { loc = (location.search || '') + ' ' + (location.hash || ''); } catch (e) { loc = ''; }
  const lc = loc.toLowerCase();
  const f = { mute: lc.indexOf('mute') >= 0, test: lc.indexOf('test') >= 0, seed: null, scene: null };
  let m = /seed=([^&#\s]+)/i.exec(loc);
  if (m) { const n = parseInt(m[1], 10); f.seed = isNaN(n) ? hash(m[1]) : n; }
  m = /scene=([^&#\s]+)/i.exec(loc);
  if (m) { try { f.scene = decodeURIComponent(m[1]); } catch (e) { f.scene = m[1]; } }
  SC.flags = f;
})();

// ---------------------------------------------------------------- storage
(function () {
  const PREFIX = 'skycat2-';
  const mem = Object.create(null);
  const MISS = {};
  SC.store = {
    get: function (key, fallback) {
      let v = mem[key];
      if (v === undefined) {
        v = MISS;
        try {
          const s = localStorage.getItem(PREFIX + key);
          if (s !== null) v = JSON.parse(s);
        } catch (e) { v = MISS; }
        mem[key] = v;
      }
      return v === MISS ? fallback : v;
    },
    set: function (key, value) {
      if (value === undefined) { this.remove(key); return; }
      mem[key] = value;
      try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); } catch (e) { /* ignore */ }
    },
    remove: function (key) {
      mem[key] = MISS;
      try { localStorage.removeItem(PREFIX + key); } catch (e) { /* ignore */ }
    },
    clear: function () {
      for (const k in mem) delete mem[k];
      try {
        const del = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf(PREFIX) === 0) del.push(k);
        }
        for (let i = 0; i < del.length; i++) localStorage.removeItem(del[i]);
      } catch (e) { /* ignore */ }
    }
  };
})();

// ---------------------------------------------------------------- canvas + page
const canvas = document.createElement('canvas');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;
SC.canvas = canvas; SC.ctx = ctx; SC.scale = 1;

function layout() {
  const iw = window.innerWidth || W, ih = window.innerHeight || H;
  const dpr = window.devicePixelRatio || 1;
  let s;
  if (SC.store.get('pixelPerfect', false) === true) {
    const sd = Math.floor(Math.min(iw * dpr / W, ih * dpr / H));
    if (sd >= 1) s = sd / dpr; else s = Math.min(iw / W, ih / H);
  } else {
    // fill the window at 16:9 (fractional scale, still nearest-neighbour)
    s = Math.min(iw / W, ih / H);
  }
  SC.scale = s;
  const cw = W * s, ch = H * s;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.style.left = (Math.round((iw - cw) / 2 * dpr) / dpr) + 'px';
  canvas.style.top = (Math.round((ih - ch) / 2 * dpr) / dpr) + 'px';
}
SC.relayout = layout;

function setupDom() {
  const de = document.documentElement, b = document.body;
  const css = 'margin:0;padding:0;background:#000;overflow:hidden;width:100%;height:100%;' +
    'touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;' +
    '-webkit-tap-highlight-color:transparent;overscroll-behavior:none;';
  de.style.cssText += css;
  b.style.cssText += css;
  const cs = canvas.style;
  cs.position = 'fixed';
  cs.display = 'block';
  cs.background = '#000';
  cs.imageRendering = 'pixelated';
  cs.touchAction = 'none';
  cs.outline = 'none';
  try { cs.setProperty('image-rendering', 'crisp-edges'); cs.setProperty('image-rendering', 'pixelated'); } catch (e) { /* ignore */ }
  if (!document.querySelector('meta[name=viewport]')) {
    const mv = document.createElement('meta');
    mv.name = 'viewport';
    mv.content = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no';
    document.head.appendChild(mv);
  }
  b.appendChild(canvas);
  layout();
}
if (document.body) setupDom();
else document.addEventListener('DOMContentLoaded', setupDom);
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', layout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

// ---------------------------------------------------------------- drawing primitives
function rect(x, y, w, h, color) {
  const x0 = Math.round(x), y0 = Math.round(y);
  const rw = Math.round(x + w) - x0, rh = Math.round(y + h) - y0;
  if (rw <= 0 || rh <= 0) return;
  ctx.fillStyle = color;
  ctx.fillRect(x0, y0, rw, rh);
}

function line(x0, y0, x1, y1, color, thick) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const t = thick > 1 ? Math.round(thick) : 1;
  const o = t >> 1;
  ctx.fillStyle = color;
  if (y0 === y1) { const a = Math.min(x0, x1); ctx.fillRect(a - o, y0 - o, Math.abs(x1 - x0) + t, t); return; }
  if (x0 === x1) { const a = Math.min(y0, y1); ctx.fillRect(x0 - o, a - o, t, Math.abs(y1 - y0) + t); return; }
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    ctx.fillRect(x0 - o, y0 - o, t, t);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

function dotLine(x0, y0, x1, y1, color, gap, offset) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const g = gap > 1 ? Math.round(gap) : 3;
  let i = Math.round(offset || 0);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  ctx.fillStyle = color;
  for (;;) {
    if ((((i % g) + g) % g) === 0) ctx.fillRect(x0, y0, 1, 1);
    i++;
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

// filled annulus via row spans (ri <= 0 gives a filled disc)
function annulus(cx, cy, ro, ri, color) {
  ctx.fillStyle = color;
  const ro2 = ro * ro, ri2 = ri > 0 ? ri * ri : -1;
  const r = Math.ceil(ro);
  const y0 = Math.max(-r, -cy - 2), y1 = Math.min(r, H - cy + 2);
  for (let dy = y0; dy <= y1; dy++) {
    const d = ro2 - dy * dy;
    if (d < 0) continue;
    const xo = Math.floor(Math.sqrt(d));
    const yy = cy + dy;
    if (ri2 > dy * dy) {
      const xi = Math.floor(Math.sqrt(ri2 - dy * dy)) + 1;
      if (xi > xo) continue;
      ctx.fillRect(cx - xo, yy, xo - xi + 1, 1);
      ctx.fillRect(cx + xi, yy, xo - xi + 1, 1);
    } else {
      ctx.fillRect(cx - xo, yy, xo * 2 + 1, 1);
    }
  }
}

function outline(cx, cy, r, color) {
  r = Math.round(r);
  ctx.fillStyle = color;
  if (r <= 0) { ctx.fillRect(cx, cy, 1, 1); return; }
  let x = r, y = 0, err = 1 - r;
  const lo = -2, hx = W + 2, hy = H + 2;
  while (x >= y) {
    const a = cx + x, b = cx - x, c = cx + y, d = cx - y;
    const e = cy + y, f = cy - y, g = cy + x, h = cy - x;
    if (e >= lo && e <= hy) { if (a >= lo && a <= hx) ctx.fillRect(a, e, 1, 1); if (b >= lo && b <= hx) ctx.fillRect(b, e, 1, 1); }
    if (f >= lo && f <= hy) { if (a >= lo && a <= hx) ctx.fillRect(a, f, 1, 1); if (b >= lo && b <= hx) ctx.fillRect(b, f, 1, 1); }
    if (g >= lo && g <= hy) { if (c >= lo && c <= hx) ctx.fillRect(c, g, 1, 1); if (d >= lo && d <= hx) ctx.fillRect(d, g, 1, 1); }
    if (h >= lo && h <= hy) { if (c >= lo && c <= hx) ctx.fillRect(c, h, 1, 1); if (d >= lo && d <= hx) ctx.fillRect(d, h, 1, 1); }
    y++;
    if (err < 0) err += 2 * y + 1; else { x--; err += 2 * (y - x) + 1; }
  }
}

function circle(cx, cy, r, color, fill) {
  cx = Math.round(cx); cy = Math.round(cy);
  if (fill) annulus(cx, cy, r + 0.5, 0, color); else outline(cx, cy, r, color);
}

function ring(cx, cy, r, color, thick) {
  cx = Math.round(cx); cy = Math.round(cy);
  const t = thick === undefined ? 1 : thick;
  if (t <= 1) { outline(cx, cy, r, color); return; }
  annulus(cx, cy, r + t / 2, r - t / 2, color);
}

function clear(color) {
  ctx.fillStyle = color || '#000';
  ctx.fillRect(-64, -64, W + 128, H + 128);
}

function frameRect(x, y, w, h, color, thick) {
  const t = thick || 1;
  rect(x, y, w, t, color);
  rect(x, y + h - t, w, t, color);
  rect(x, y + t, t, h - 2 * t, color);
  rect(x + w - t, y + t, t, h - 2 * t, color);
}

SC.rect = rect; SC.line = line; SC.dotLine = dotLine; SC.circle = circle;
SC.ring = ring; SC.clear = clear; SC.frameRect = frameRect;
SC.noShake = function (fn) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  try { fn(); } finally { ctx.restore(); }
};

// ---------------------------------------------------------------- pixel font 5x7

  'A': '.###.|#...#|#...#|#####|#...#|#...#|#...#',
  'B': '####.|#...#|#...#|####.|#...#|#...#|####.',
  'C': '.###.|#...#|#....|#....|#....|#...#|.###.',
  'D': '####.|#...#|#...#|#...#|#...#|#...#|####.',
  'E': '#####|#....|#....|####.|#....|#....|#####',
  'F': '#####|#....|#....|####.|#....|#....|#....',
  'G': '.###.|#...#|#....|#.###|#...#|#...#|.###.',
  'H': '#...#|#...#|#...#|#####|#...#|#...#|#...#',
  'I': '.###.|..#..|..#..|..#..|..#..|..#..|.###.',
  'J': '..###|...#.|...#.|...#.|...#.|#..#.|.##..',

  'O': '.###.|#...#|#...#|#...#|#...#|#...#|.###.',
  'P': '####.|#...#|#...#|####.|#....|#....|#....',
  'Q': '.###.|#...#|#...#|#...#|#.#.#|#..#.|.##.#',
  'R': '####.|#...#|#...#|####.|#.#..|#..#.|#...#',
  'S': '.####|#....|#....|.###.|....#|....#|####.',
  'T': '#####|..#..|..#..|..#..|..#..|..#..|..#..',
  'U': '#...#|#...#|#...#|#...#|#...#|#...#|.###.',
  'V': '#...#|#...#|#...#|#...#|#...#|.#.#.|..#..',

  '6': '.###.|#....|#....|####.|#...#|#...#|.###.',

const GLYPH_CHARS = Object.keys(GLYPH_SRC);
const GLYPH_IDX = Object.create(null);
for (let i = 0; i < GLYPH_CHARS.length; i++) GLYPH_IDX[GLYPH_CHARS[i]] = i;
for (let i = 0; i < 26; i++) {
  const u = String.fromCharCode(65 + i);
  GLYPH_IDX[u.toLowerCase()] = GLYPH_IDX[u];
}
const QMARK = GLYPH_IDX['?'];
const FONT_ATLAS_W = GLYPH_CHARS.length * 5;
let fontWhite = null;
const fontTinted = new Map();

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function getFontAtlas(color) {
  if (!fontWhite) {
    fontWhite = makeCanvas(FONT_ATLAS_W, 7);
    const g = fontWhite.getContext('2d');
    g.fillStyle = '#fff';
    for (let i = 0; i < GLYPH_CHARS.length; i++) {
      const rows = GLYPH_SRC[GLYPH_CHARS[i]].split('|');
      for (let y = 0; y < 7; y++) {
        const row = rows[y];
        for (let x = 0; x < 5; x++) if (row.charAt(x) === '#') g.fillRect(i * 5 + x, y, 1, 1);
      }
    }
  }
  if (color === '#fff' || color === '#ffffff' || color === 'white') return fontWhite;
  let a = fontTinted.get(color);
  if (!a) {
    if (fontTinted.size > 96) fontTinted.clear();
    a = makeCanvas(FONT_ATLAS_W, 7);
    const g = a.getContext('2d');
    g.drawImage(fontWhite, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color;
    g.fillRect(0, 0, FONT_ATLAS_W, 7);
    fontTinted.set(color, a);
  }
  return a;
}

function lineWidth(str, s) { return str.length > 0 ? str.length * 6 * s - s : 0; }

function textWidth(str, scale) {

function headLayer(o) {
  const half = o.ears === 'back' ? HEAD_BACK : HEAD_UP;
  const h = mirror(half).map((r) => r.split(''));
  let eL = EYE[o.eyes], eR = EYE[o.eyes];
  if (o.eyes === 'hurt') { eL = EYE.hurtL; eR = EYE.hurtR; }
  if (o.eyes === 'ang') { eL = EYE.angL; eR = EYE.angR; }
  shade(h, 'b', 'l', 's');
  patch(h, 10.5, 6, 2.5, 1.6, 'v');
  [[eL, 2], [eR, 9]].forEach(([e, x0]) => {
    e.forEach((r, j) => { for (let i = 0; i < 3; i++) if (r[i] !== '.') put(h, x0 + i, 5 + j, r[i]); });
  });
  if (o.mouth === 'open') { put(h, 6, 10, 'm'); put(h, 7, 10, 'm'); put(h, 6, 11, 't'); put(h, 7, 11, 't'); }
  if (o.mouth === 'tongue') { put(h, 7, 11, 't'); put(h, 7, 10, 'm'); put(h, 6, 10, 'm'); }
  if (o.mouth === 'flat') { put(h, 5, 10, 'm'); put(h, 6, 10, 'm'); put(h, 7, 10, 'm'); put(h, 8, 10, 'm'); }

  put(h, 1, 9, 'x'); put(h, 12, 9, 'x');
  outline(h, 'o', true);
  return h;
}

function tailLayer(p0, p1, p2, n, thick) {
  const t = mkg(CW, CH), pts = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    pts.push([a * p0[0] + b * p1[0] + c * p2[0], a * p0[1] + b * p1[1] + c * p2[1]]);
  }
  pts.forEach((q, i) => {
    const sz = i < n * 0.55 || thick ? 3 : 2, off = sz > 2 ? 1 : 0;
    rect(t, Math.round(q[0]) - off, Math.round(q[1]) - off, sz, sz, 'b');
  });
  shade(t, 'b', 'l', 's');
  pts.forEach((q, i) => {
    const x = Math.round(q[0]), y = Math.round(q[1]);
    const ch = i >= n - 2 ? 'q' : (i % 5 === 3 && i < n - 3 ? 'p' : null);
    if (!ch) return;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      if (get(t, x + dx, y + dy) !== '.' && get(t, x + dx, y + dy) !== 'o') put(t, x + dx, y + dy, ch);

}

function bodyLayer(cx, cy, rx, ry) {

    for (let i = 0; i < w; i++) if (get(b, Math.round(x) + i, Math.round(y)) === 'b' && get(b, Math.round(x) + i, Math.round(y) - 1) !== '.') put(b, x + i, y, 'p');
  });
  patch(b, cx + 1, cy - 1, 3.2, 1.8, 'u');
  patch(b, cx - 4.5, cy + 2.2, 2, 1.6, 'v');
  outline(b, 'o', true);
  return b;
}

function packLayer() {

function armLayer(x0, y0, x1, y1) {

  for (let i = 0; i <= n; i++) {
    const u = i / n, x = Math.round(x0 + (x1 - x0) * u), y = Math.round(y0 + (y1 - y0) * u);

  rect(a, x1 - 1, y1 - 1, 3, 3, 'q');
  outline(a, 'o', false);

}

function catGrid(o) {
  const g = mkg(CW, CH);

  comp(g, tl, ox, oy);

}

    const s = cp(g);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (s[y][x] === 'h' && get(s, x, y + 1) === 'd' && get(s, x, y + 2) === '.') g[y][x] = 'd';

}

    const dx = Math.min(x - x0, x1 - x), dy = Math.min(y - y0, y0 + h - 1 - y);
    if (dx + dy < (h >= 8 ? 3 : 2)) continue;
    const edge = y === y0 || y === y0 + h - 1;

  }
  const cy = y0 + Math.floor((h - 1) / 2);

    put(g, cx - 1, cy - 1, 'W'); put(g, cx, cy - wr + 0.4, 'W');
    put(g, cx, cy, 'k');

    put(g, cx + d[0], cy + d[1], 'W');

art.trails = [
  { id: 'classic', name: 'Classic', price: 0, particles: [P.red, P.orange, P.yellow] },
  { id: 'plasma', name: 'Plasma', price: 150, particles: [P.blue, P.sky, P.cyan, P.white] },
  { id: 'toxic', name: 'Toxic', price: 250, particles: [P.forest, P.green, P.lime] },
  { id: 'ember', name: 'Ember', price: 350, particles: [P.darkred, P.red, P.orange, P.yellow] },
  { id: 'bubble', name: 'Bubbles', price: 450, particles: [P.sky, P.cyan, P.white] },
  { id: 'heart', name: 'Hearts', price: 600, particles: [P.magenta, P.pink, P.red, P.white] },
  { id: 'rainbow', name: 'Rainbow', price: 800, particles: [P.red, P.orange, P.yellow, P.green, P.sky, P.purple] },
  { id: 'starlight', name: 'Starlight', price: 1000, particles: [P.navy, P.indigo, P.yellow, P.white] },
  { id: 'void', name: 'Void', price: 1200, particles: [P.dark, P.purple, P.plum, P.white] }
];
{
  const FL = [11, 15, 12, 16];
  const baseFlame = (k, pick) => {
    const g = mkg(11, 20), len = FL[k];
    for (let y = 0; y < len; y++) {
      const u = y / len, hw = 4.3 * Math.pow(1 - u, 0.85) + (y < 2 ? 0.4 : 0) + (k & 1 ? 0.3 : 0) * (1 - u);
      const sway = Math.sin(y * 0.9 + k * 1.6) * 0.5 * u;
      for (let x = 0; x < 11; x++) {
        const dx = Math.abs(x - 5 - sway);
        if (dx <= hw) g[y][x] = pick(dx, hw, u, y);
      }
    }
    return g;
  };
  const std = (dx, hw, u) => (dx > hw * 0.66 ? 'R' : (dx > hw * 0.38 ? 'O' : (dx > hw * 0.18 || u > 0.55 ? 'Y' : 'W')));
  const tail = (g, k, len) => { put(g, 5, len + 1 + (k & 1), 'Y'); put(g, 3 + (k % 3) * 2, len - 3, 'O'); };
  const inBody = (g, x, y) => get(g, x, y) !== '.';
  const mk = (id, cols, build) => {
    const f = [];
    for (let k = 0; k < 4; k++) f.push(build(k));
    def('jetflame_' + id, f.map(rows), cols, { anchor: { x: 5, y: 0 } });
  };
  const plus = (g, x, y, c, cc) => { put(g, x, y, cc); put(g, x - 1, y, c); put(g, x + 1, y, c); put(g, x, y - 1, c); put(g, x, y + 1, c); };
  mk('classic', { R: P.red, O: P.orange, Y: P.yellow, W: P.white }, (k) => { const g = baseFlame(k, std); tail(g, k, FL[k]); return g; });
  mk('plasma', { R: P.blue, O: P.sky, Y: P.cyan, W: P.white }, (k) => {
    const g = baseFlame(k, std); tail(g, k, FL[k]);
    const r = mulberry(k * 31 + 7);
    for (let i = 0; i < 3; i++) { const y = 3 + Math.floor(r() * (FL[k] - 5)), x = r() < 0.5 ? Math.floor(r() * 2) : 9 + Math.floor(r() * 2); put(g, x, y, 'W'); if (r() < 0.6) put(g, x + (x < 5 ? 1 : -1), y + 1, 'Y'); }
    return g;
  });
  mk('toxic', { R: P.forest, O: P.green, Y: P.lime, W: P.cream, E: P.lime, B: P.green }, (k) => {
    const g = baseFlame(k, std); tail(g, k, FL[k]);
    const r = mulberry(k * 13 + 3);
    for (let i = 0; i < 3; i++) { const y = 2 + Math.floor(r() * (FL[k] - 3)), x = 3 + Math.floor(r() * 5); if (inBody(g, x, y) && g[y][x] !== 'R') g[y][x] = 'W'; }
    put(g, 3 + (k % 2) * 4, FL[k] + 2, 'E'); put(g, 7 - (k % 2) * 4, FL[k] + 3, 'B');
    return g;
  });
  mk('ember', { R: P.darkred, O: P.red, Y: P.orange, W: P.yellow, S: P.yellow, s: P.orange }, (k) => {
    const g = baseFlame(k, std); tail(g, k, FL[k]);
    const r = mulberry(k * 57 + 11);
    for (let i = 0; i < 5; i++) { const y = 2 + Math.floor(r() * 17), x = Math.floor(r() * 11); if (!inBody(g, x, y) && !inBody(g, x - 1, y) && !inBody(g, x + 1, y)) put(g, x, y, i & 1 ? 'S' : 's'); }
    return g;
  });
  mk('bubble', { c: P.cyan, w: P.white, B: P.sky }, (k) => {
    const g = mkg(11, 20);
    for (let y = 0; y < 4; y++) { const hw = 2.2 - y * 0.5; for (let x = 0; x < 11; x++) if (Math.abs(x - 5) <= hw) g[y][x] = y < 2 ? 'B' : 'c'; }
    const BP = [
      [".ccc.", "c...c", "c.w.c", "c...c", ".ccc."],
      [".cc.", "cw.c", "c..c", ".cc."],
      [".c.", "c.c", ".c."],
      ["c"]
    ];
    [[3, 4, 0], [0, 8, 1], [6, 11, 1], [3, 14, 2], [6, 17, 3], [1, 19, 3]].forEach(([bx, by, t], i) => {
      const y = by + ((k + i) % 4) * 2 - 2;
      if (y < 4 || y > 19) return;
      const x = bx + (((k + i) & 1) ? 1 : 0);
      BP[t].forEach((r, j) => { for (let q = 0; q < r.length; q++) if (r[q] !== '.') put(g, x + q, y + j, r[q]); });
    });
    return g;
  });
  mk('heart', { R: P.magenta, O: P.pink, Y: P.peach, W: P.white, h: P.red, H: P.pink }, (k) => {
    const g = baseFlame(k, std); tail(g, k, FL[k]);
    [[0, 4 + k * 4], [8, 12 + k * 4]].forEach(([x, y]) => {
      y %= 17;
      ['h.h', 'hhh', '.h.'].forEach((r, j) => { for (let i = 0; i < 3; i++) if (r[i] === 'h') put(g, x + i, y + j, 'h'); });
      put(g, x, y, 'H');
    });
    return g;
  });
  mk('rainbow', { 1: P.red, 2: P.orange, 3: P.yellow, 4: P.green, 5: P.sky, 6: P.purple }, (k) => {
    const g = baseFlame(k, (dx, hw, u, y) => String(1 + (Math.floor((y + k * 2) / 2.2) % 6)));
    put(g, 5, FL[k] + 1, '6'); put(g, 3 + (k % 3) * 2, FL[k] - 3, '3');
    return g;
  });
  mk('starlight', { R: P.navy, O: P.indigo, Y: P.blue, W: P.sky, y: P.yellow, w: P.white }, (k) => {
    const g = baseFlame(k, std);
    [[3, 5 + 4 * k], [8, 12 + 4 * k], [5, 1 + 3 * k]].forEach(([x, y], i) => { y = Math.max(1, y % 19); if (((k + i) & 1) === 0) plus(g, x, y, 'y', 'w'); else put(g, x, y, 'w'); });
    return g;
  });
  mk('void', { R: P.dark, O: P.indigo, Y: P.purple, W: P.plum, S: P.white }, (k) => {
    const g = baseFlame(k, std); tail(g, k, FL[k]);
    const r = mulberry(k * 91 + 17);
    for (let i = 0; i < 5; i++) { const y = 1 + Math.floor(r() * (FL[k] + 2)), x = 2 + Math.floor(r() * 7); put(g, x, y, 'S'); }
    return g;
  });
}

  };

    let w;

// Optional global leaderboard client. The only file allowed to use fetch.
// The game works fully offline: every call resolves to null on any failure.
(function () {
  'use strict';
  const SC = window.SC;

  const DEFAULT_URL = 'https://sky-cat-leaderboard.stickshot-signaling.workers.dev';
  const TIMEOUT = 5000;

  function qs() {
    try { return (location.search || '') + (location.hash || ''); } catch (e) { return ''; }
  }
  const q = qs();
  let url = DEFAULT_URL;
  const m = /[?&]lb=([^&#]+)/.exec(q);
  if (m) { try { url = decodeURIComponent(m[1]).replace(/\/+$/, ''); } catch (e) {} }

  const flags = SC.flags || {};
  const enabled = !flags.test || /net/.test(q);
  if (flags.test && enabled) flags.net = true;

  function uuid() {
    try {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    } catch (e) {}
    let s = '';
    for (let i = 0; i < 32; i++) {
      if (i === 8 || i === 12 || i === 16 || i === 20) s += '-';
      s += Math.floor(Math.random() * 16).toString(16);
    }
    return s;
  }

  let id = SC.store.get('lb_id', null);
  if (typeof id !== 'string' || !/^[a-z0-9-]{16,40}$/.test(id)) {
    id = uuid();
    SC.store.set('lb_id', id);
  }

  const cache = {};
  const net = {
    url: url,
    id: id,
    status: 'idle',
    getName() { const n = SC.store.get('lb_name', ''); return typeof n === 'string' ? n : ''; },
    setName(n) {
      n = String(n || '').toUpperCase().replace(/[^A-Z0-9 _-]/g, '').slice(0, 12);
      SC.store.set('lb_name', n);
      return n;
    },
    hasName() { return /^[A-Z0-9 _-]{3,12}$/.test(net.getName()); },
    myRank(mode) { const c = cache[mode || 'endless']; return c && c.you ? c.you.rank : null; },
    cache: cache,
  };

  function request(path, opts) {
    if (!enabled || typeof fetch !== 'function') { net.status = 'offline'; return Promise.resolve(null); }
    let ctl = null, timer = null;
    try {
      ctl = new AbortController();
      timer = setTimeout(function () { ctl.abort(); }, TIMEOUT);
    } catch (e) {}
    net.status = 'loading';
    const o = Object.assign({}, opts || {});
    if (ctl) o.signal = ctl.signal;
    return fetch(url + path, o).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, data: d }; });
    }).then(function (res) {
      if (timer) clearTimeout(timer);
      if (!res.ok) { net.status = 'ok'; return null; }
      net.status = 'ok';
      return res.data;
    }).catch(function () {
      if (timer) clearTimeout(timer);
      net.status = 'offline';
      return null;
    });
  }

  net.submit = function (p) {
    try {
      p = p || {};
      const mode = p.mode || 'endless';
      const body = {
        // no name chosen yet: fall back to a stable CAT#### so the score still counts
        id: id, name: net.hasName() ? net.getName() : 'CAT' + (parseInt(String(id).replace(/[^0-9]/g, '').slice(-4) || '0', 10) % 10000), mode: mode,
        score: Math.floor(p.score || 0), wave: Math.floor(p.wave || 0),
        kos: Math.floor(p.kos || 0), time: Math.floor(p.time || 0),
        skin: String(SC.store.get('skin', 'ginger') || 'ginger'), v: 1,
      };
      return request('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).then(function (r) {
        if (r && typeof r.rank === 'number') {
          const c = cache[mode] || (cache[mode] = {});
          c.you = { rank: r.rank, score: r.best };
          c.total = r.total;
        }
        return r;
      }).catch(function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  };

  net.top = function (mode) {
    try {
      mode = mode || 'endless';
      return request('/api/top?mode=' + encodeURIComponent(mode) + '&limit=50&id=' + encodeURIComponent(id))
        .then(function (r) {
          if (r && Array.isArray(r.entries)) { cache[mode] = r; return r; }
          return null;
        }).catch(function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  };

  SC.net = net;
})();

<script>
// Sky Cat UI: immediate-mode pixel widgets, menu scenes, touch controls. Everything drawn with SC primitives.
(function () {

  ui.card = function (id, x, y, w, h, o) {

  // scripted mini-battle (300 frames loop): heavy fires, cat parries, shell kills the light tank, cat dives the hatch
  const BAT = 300, HX = 262, LX = 168, HOME = { x: 232, y: 156 };
  let bat = 0;
  const hvy = () => enemy('tank_heavy'), lgt = () => enemy('tank_light');
  function heavyX(T) { return T < 122 ? HX : (T < 200 ? null : (T < 260 ? HX + Math.round((1 - SC.ease.outCubic((T - 200) / 60)) * 80) : HX)); }
  function lightX(T) { return T < 80 ? LX : (T < 190 ? null : (T < 240 ? LX - Math.round((1 - SC.ease.outCubic((T - 190) / 50)) * 58) : LX)); }
  function shellPts() {
    const H0 = hvy();
    return { sx: HX + 2, sy: 236 - H0.h + 2 + 8, px: HOME.x + 22, py: HOME.y + 8 };
  }
  // cat centre for time T
  function batCatPos(T) {
    const b = Math.sin(T * 0.07) * 4;
    if (T < 100) return { x: HOME.x, y: HOME.y + b, kind: 'fly' };
    if (T < 108) { const u = (T - 100) / 8; return { x: HOME.x - 8 * u, y: HOME.y + b, kind: 'idle' }; }
    const H0 = hvy();
    const tx = HX + H0.hatch.x + H0.hatch.w / 2, ty = 236 - H0.h + 2 + H0.hatch.y + 2;
    if (T < 122) { const u = (T - 108) / 14; return { x: HOME.x - 8 + (tx - HOME.x + 8) * u, y: HOME.y + (ty - HOME.y) * u, kind: 'dash' }; }
    if (T < 170) { const u = SC.ease.outCubic((T - 122) / 48); return { x: tx + (HOME.x - tx) * u, y: ty - 26 * Math.sin(Math.min(1, (T - 122) / 24) * Math.PI / 1.4) + (HOME.y - ty) * u, kind: 'fly' }; }
    return { x: HOME.x, y: HOME.y + b, kind: 'fly' };
  }
  function batEvents(T) {
    if (!hvy() || !lgt()) return;
    const L = lgt(), H0 = hvy();
    if (T === 58) {
      const p = shellPts();
      SC.fx.ring(p.px, p.py, { color: '#ffffff', r0: 4, r1: 46, life: 18, thick: 2 });
      SC.fx.burst(p.px, p.py, { n: 14, colors: ['#ffffff', C.cyan, C.gold], speed: 3, life: 22 });
      SC.fx.shake(2, 6);
    }
    if (T === 80) {
      const ex = LX + L.w / 2, ey = 236 - L.h / 2 + 2;
      SC.fx.debris(ex, ey, { n: 8, colors: ['#555a6e', '#8a8fa6', C.orange] });
      SC.fx.burst(ex, ey, { n: 12, colors: [C.orange, C.gold, '#ffffff'], speed: 3, life: 20 });
      SC.fx.shake(2, 8);
    }
    if (T === 122) {
      const ex = HX + H0.w / 2, ey = 236 - H0.h / 2 + 2;
      SC.fx.debris(ex, ey, { n: 12, colors: ['#555a6e', '#8a8fa6', C.orange, C.gold] });
      SC.fx.burst(ex, ey, { n: 20, colors: [C.orange, C.gold, '#ffffff'], speed: 4, life: 28 });

      SC.fx.shake(4, 12);
    }
  }
  function drawBattle() {
    const CAT = SC.art && SC.art.CAT, H0 = hvy(), L = lgt();
    if (!CAT || !H0 || !L) return;
    const T = bat % BAT;
    const hx = heavyX(T), lx = lightX(T);
    const htop = 236 - H0.h + 2, ltop = 236 - L.h + 2;
    const hMoving = T >= 200 && T < 260, lMoving = T >= 190 && T < 240;
    const flash = T >= 40 && T < 44;
    if (hx !== null) spr('tank_heavy', H0.frames.move[hMoving ? (T >> 2) % H0.frames.move.length : 0], hx, htop, { white: flash });
    if (lx !== null) spr('tank_light', L.frames.move[lMoving ? (T >> 2) % L.frames.move.length : 0], lx, ltop);
    const p = shellPts();
    if (T >= 16 && T < 40) {
      sprC('warn', T >> 3, HX + H0.w / 2, htop - 10);
      SC.dotLine(p.sx, p.sy, p.px, p.py, 'rgba(255,93,108,0.85)', 3, T);
    }
    if (T >= 40 && T < 58) {
      const u = (T - 40) / 18;
      sprC('shell', T >> 1, p.sx + (p.px - p.sx) * u, p.sy + (p.py - p.sy) * u);
    }
    if (T >= 58 && T < 80) {
      const u = (T - 58) / 22, tx = LX + L.hatch.x + L.hatch.w / 2, ty = ltop + L.hatch.y + 2;
      sprC('shell_p', T >> 1, p.px + (tx - p.px) * u, p.py + (ty - p.py) * u);
    }
    if (T >= 80 && T < 96) sprC('explosion', (T - 80) >> 1, LX + L.w / 2, ltop + L.h / 2);
    if (T >= 122 && T < 142) sprC('explosion_big', (T - 122) >> 1, HX + H0.w / 2, htop + H0.h / 2);
    if (T >= 122 && T < 150) for (let i = 0; i < 4; i++) sprC('smoke', Math.min(4, (T - 122) >> 3), HX + 8 + i * 12, htop + 6 - ((T - 122) >> 1) - i * 3, { alpha: 0.8 });
    if (T >= 90 && T < 122) sprC('hatch_glow', T >> 2, HX + H0.hatch.x + H0.hatch.w / 2, htop + H0.hatch.y + 2);
    // cat (drawn after debris so it stays on top)
    const cp = batCatPos(T);
    const ox = cp.x - CAT.centre.x, oy = cp.y - CAT.centre.y;
    const pt = T - 54;
    if (cp.kind === 'dash') {
      for (let k = 3; k >= 1; k--) {
        const q = batCatPos(Math.max(108, T - k * 2));
        drawCat(q.x - CAT.centre.x, q.y - CAT.centre.y, { kind: 'dash', idx: 0, alpha: 0.5 / k, flame: false });
      }
      drawCat(ox, oy, { kind: 'dash', idx: T >> 1 });
    } else if (pt >= 0 && pt < 13) {
      const fi = Math.min(2, pt >> 2);
      drawCat(ox, oy, { kind: 'parry', idx: fi });
      const hp = (CAT.handFrames && CAT.handFrames.parry && CAT.handFrames.parry[fi]) || CAT.hand;
      if (pt >= 2 && pt < 9) {
        if (hasSpr('slash_big')) sprC('slash_big', (pt - 2) >> 1, cp.x + 20, cp.y);
        else spr('slash', (pt - 2) >> 1, ox + hp.x, oy + hp.y);
      }
      sprAnch(stickSpr(), Math.min(5, pt >> 1), ox + hp.x, oy + hp.y, false);
    } else {
      drawCat(ox, oy, { kind: cp.kind === 'idle' ? 'idle' : 'fly', idx: T >> 3 });
    }
    if (T >= 58 && T < 84) SC.text('PARRY!', cp.x + 4, cp.y - 38, { scale: 2, align: 'center', color: C.cyan, wave: 1 });
    if (T >= 122 && T < 168) SC.text('DIVE KO!', HX + H0.w / 2 - 26, 150 - (T < 132 ? 0 : ((T - 132) >> 3)), { scale: 2, align: 'center', color: C.gold, wave: 1 });
  }

  // ---------- HOW TO PLAY ----------
  const AW = 148, AH = 84;
  function demoFrame(ax, ay) {
    SC.rect(ax, ay, AW, AH, '#172044');
    for (let i = 0; i < 6; i++) { // scrolling stars
      const sx = ((i * 53 - SC.frame * (0.2 + i * 0.05)) % AW + AW) % AW;
      SC.rect(ax + sx, ay + 6 + (i * 17) % 40, 1, 1, '#4b5c96');
    }
    SC.rect(ax, ay + AH - 10, AW, 10, '#2b3a66');
    SC.rect(ax, ay + AH - 10, AW, 1, '#4b5c96');
  }
  const catTL = (cx, cy) => { const C0 = SC.art.CAT.centre; return { x: cx - C0.x, y: cy - C0.y }; };

  function demoDash(ax, ay, T) {
    const CAT = SC.art && SC.art.CAT, e = enemy('tank_light');
    if (!CAT || !e) return;
    const gy = ay + AH - 10, tx = Math.round(ax + AW - e.w - 22 - T * 0.3), ty = gy - e.h + 2;
    const hx = tx + e.hatch.x + e.hatch.w / 2, hy = ty + e.hatch.y + 1;
    const st = { x: ax + 16, y: ay + 12 };
    const tgt = catTL(hx, hy);
    const pos = p => ({ x: st.x + (tgt.x - st.x) * p, y: st.y + (tgt.y - st.y) * p });
    if (T < 54) {
      drawTank('tank_light', tx, ty, T >> 2);
      sprC('hatch_glow', T >> 2, hx, ty + e.hatch.y + 2);
    } else if (T - 54 < 16) sprC('explosion', (T - 54) >> 1, tx + e.w / 2, ty + e.h / 2);
    if (T < 40) drawCat(st.x, st.y + Math.sin(T * 0.2) * 3, { idx: T >> 2 });
    else if (T < 54) {
      const p = (T - 40) / 13;
      for (let k = 3; k >= 1; k--) { const q = pos(Math.max(0, p - k * 0.12)); drawCat(q.x, q.y, { kind: 'dash', idx: 0, alpha: 0.35 / k * 1.5, flame: false }); }
      const q = pos(Math.min(1, p));
      drawCat(q.x, q.y, { kind: 'dash', idx: T >> 1 });
    } else {
      const u = Math.min(1, (T - 54) / 30), q = pos(1);
      drawCat(q.x + u * 18, q.y - u * 16, { idx: T >> 2 });
    }
    if (T >= 54 && T < 100 && ((T >> 2) & 1) === 0) SC.text('DIVE KO!', ax + AW / 2, ay + 8, { align: 'center', color: C.gold, scale: 2 });
  }

  // shell flies in, cat swings, shell turns cyan and flies back, tank blows up, tank rolls back in
  function demoParry(ax, ay, T) {
    const CAT = SC.art && SC.art.CAT, e = enemy('tank_light');
    if (!CAT || !e) return;
    const gy = ay + AH - 10, tx0 = ax + AW - e.w - 8, ty = gy - e.h + 2;
    const cat = { x: ax + 14, y: ay + 36 + Math.round(Math.sin(T * 0.15) * 2) };
    const cX = cat.x + CAT.centre.x, cY = cat.y + CAT.centre.y;
    const sx = tx0 + 2, sy = ty + e.turret.y;             // muzzle
    const px = cX + 22, py = cY;                            // parry point
    const T0 = 24, T1 = T0 + Math.ceil((sx - px) / 2.2);   // launch, parry
    const T2 = T1 + Math.ceil((sx - px) / 4);              // reflected shell lands
    const alive = T < T2;
    let tx = tx0;
    if (T >= T2 + 14 && T < T2 + 50) tx = tx0 + Math.round((1 - SC.ease.outCubic((T - T2 - 14) / 36)) * AW);
    if (alive || T >= T2 + 14) drawTank('tank_light', tx, ty, (T >= T2 + 14 && T < T2 + 50) ? T >> 2 : 0);
    if (T < T0) {
      sprC('warn', T >> 3, tx0 + e.w / 2, ty - 10);
      SC.dotLine(sx, sy, px, py, 'rgba(255,93,108,0.85)', 3, T);
    }
    if (T >= T0 && T < T1) {
      const u = (T - T0) / (T1 - T0);
      sprC('shell', T >> 1, sx + (px - sx) * u, sy + (py - sy) * u);
    } else if (T >= T1 && T < T2) {
      const u = (T - T1) / (T2 - T1);
      sprC('shell_p', T >> 1, px + (sx - px) * u, py + (sy - py) * u);
    }
    if (T >= T2 && T < T2 + 16) sprC('explosion', (T - T2) >> 1, tx0 + e.w / 2, ty + e.h / 2);
    const pt = T - (T1 - 4);
    if (pt >= 0 && pt < 13) {
      const fi = Math.min(2, pt >> 2);
      drawCat(cat.x, cat.y, { kind: 'parry', idx: fi });
      const hp = (CAT.handFrames && CAT.handFrames.parry && CAT.handFrames.parry[fi]) || CAT.hand;
      if (pt >= 2 && pt < 9) spr('slash', (pt - 2) >> 1, cat.x + hp.x, cat.y + hp.y);
      sprAnch(stickSpr(), Math.min(5, pt >> 1), cat.x + hp.x, cat.y + hp.y, false);
    } else drawCat(cat.x, cat.y, { idx: T >> 2 });
    if (T >= T1 && T < T1 + 12) SC.ring(px, py, 6 + (T - T1) * 5, 'rgba(255,255,255,0.85)', 1);
    if (T >= T1 && T < T1 + 30) SC.text('PARRY!', ax + AW / 2, ay + 8, { align: 'center', color: C.cyan, scale: 2 });
  }

  function demoRocket(ax, ay, T) {
    const CAT = SC.art && SC.art.CAT, e = enemy('tank_heavy');
    if (!CAT || !e) return;
    const gy = ay + AH - 10, tx = ax + AW - e.w - 6, ty = gy - e.h + 2;
    const cat = { x: ax + 10, y: Math.round(ty + e.h / 2 - CAT.hand.y) };
    const hand0 = CAT.hand;
    const x0 = cat.x + hand0.x + 6, y0 = cat.y + hand0.y;
    const ts = [14, 42, 70], hs = ts.map(t => t + (tx + 4 - x0) / 3.4);
    const dead = T >= hs[2];
    if (!dead) {
      const flash = hs.some(h => T >= h && T < h + 3);
      spr('tank_heavy', e.frames.move[(T >> 2) % e.frames.move.length], tx, ty, { white: flash });
    }
    ts.forEach((t, i) => {
      if (T >= t && T < hs[i]) {
        const rx = x0 + 3.4 * (T - t);
        sprC('rocket', 0, rx, y0);
        for (let k = 1; k < 5; k++) if (rx - k * 7 > x0) sprC('smoke', Math.min(4, k), rx - k * 7 - 6, y0 + (k & 1));
      }
      if (T >= hs[i] && T < hs[i] + 16) {
        if (i === 2) sprC('explosion_big', Math.floor(T - hs[i]) >> 1, tx + e.w / 2, ty + e.h / 2);
        else sprC('explosion', Math.floor(T - hs[i]) >> 1, tx + 6, y0);
      }
    });
    const rec = ts.some(t => T >= t && T < t + 6);
    drawCat(cat.x, cat.y, { kind: 'shoot', idx: rec ? 1 : 0 });
    const hp = (CAT.handFrames && CAT.handFrames.shoot && CAT.handFrames.shoot[rec ? 1 : 0]) || hand0;
    spr('bazooka', rec ? 1 : 0, cat.x + hp.x, cat.y + hp.y);
    for (let i = 0; i < 3; i++) SC.rect(ax + 4 + i * 6, ay + 4, 4, 4, T < ts[i] ? C.orange : '#3a3a55');
    if (dead && T < hs[2] + 30) SC.text('BOOM!', ax + AW / 2, ay + 8, { align: 'center', color: C.orange, scale: 2 });
  }

      x += ui.keycap(ui.keyLabel('pause'), x, y) + 16;

  const CTL_NAME = {};

  let cSel = null, cNote = '', cNoteT = 0;
  function cStop() { if (cSel) { cSel = null; } if (inp().capturing) inp().captureKey(null); }
  function cStart(action, slot) {
    cSel = { action: action, slot: slot };
    cNote = ''; cNoteT = 0;
    inp().captureKey(function (code) {
      const sel = cSel; cSel = null;
      if (!sel || code === null) { sfx('back'); return; }
      if (code === 'Backspace' || code === 'Delete') {
        inp().setBinding(sel.action, sel.slot, null);
        cNote = CTL_NAME[sel.action] + ' SLOT CLEARED'; cNoteT = 150; sfx('back');
        return;
      }
      const moved = inp().setBinding(sel.action, sel.slot, code);
      cNote = moved ? inp().keyName(code) + ' MOVED FROM ' + CTL_NAME[moved] : inp().keyName(code) + ' BOUND TO ' + CTL_NAME[sel.action];
      cNoteT = 220; sfx('confirm');
    });
  }

  const clampN = (v, a, b) => Math.max(a, Math.min(b, v));

  const RK_COL = ['#ffd23f', '#d5dbea', '#e09a5a'];
  function lbLoad() {
    const tok = ++lbTok;
    lb = { state: 'loading', data: null };
    if (!SC.net || !SC.net.top) { lb.state = 'offline'; return; }
    let pr = null;
    try { pr = SC.net.top('endless'); } catch (e) { pr = null; }
    if (!pr || !pr.then) { lb.state = 'offline'; return; }
    pr.then(d => { if (tok !== lbTok) return; if (d && d.entries) { lb.data = d; lb.state = 'ok'; } else lb.state = 'offline'; },

  // ---------- HISTORY (this device's last runs) ----------
  let hiScroll = 0;
  SC.scene('history', {
    enter() { ui.resetFocus(); hiScroll = 0; SC.music.play('title'); },
    update() { scroll += 0.5 * SC.dt; },
    draw() {
      ui.lockV = true;
      const I = inp();
      drawBG(2, scroll);
      ui.band(0, 240, 'rgba(8,10,24,0.78)');
      title3('HISTORY', 12, 6, 'ic_target');
      const h = store.get('history', []) || [];
      const ROWS = 15, RH = 12, ly = 50, maxS = Math.max(0, h.length - ROWS);
      SC.text('YOUR LAST RUNS', 12, 34, { color: C.gold });
      SC.text(h.length + ' SAVED', W - 12, 34, { align: 'right', color: C.dim });
      SC.rect(10, 44, W - 20, 1, 'rgba(255,255,255,0.15)');
      let d = 0;
      if (I.pressed('up')) d -= 1;
      if (I.pressed('down')) d += 1;
      if (I.takeWheel) d += Math.round(I.takeWheel() / 60);
      hiScroll = clampN(hiScroll + d, 0, maxS);
      const best = h.reduce((m, r) => Math.max(m, r.score || 0), 0);
      for (let i = 0; i < ROWS; i++) {

    const off = document.createElement('canvas');

    off.toBlob(blob => {
      if (!blob) return;
      const name = 'sky-cat-score.png';
      try {
        const file = new File([blob], name, { type: 'image/png' });

  // ---------- TOUCH CONTROLS ----------
  const TC = {

    btns: [
      { a: 'dash', x: 436, y: 216, r: 22, ic: 'ic_bolt' },
      { a: 'parry', x: 384, y: 226, r: 18, ic: 'ic_shield' },
      { a: 'fire', x: 436, y: 162, r: 18, ic: 'ic_rocket' }
    ],
    pause: { x: 454, y: 6, s: 20 }
  };
  ui.touchControls = function () {
    const I = inp(), ts = I.touches || [], R_ = 28;
    const live = ts.filter(t => !t.released);
    // stick acquire / release
    if (TC.stickId != null && !live.some(t => t.id === TC.stickId)) { TC.stickId = null; TC.kx = TC.ky = 0; I.setStick(0, 0); }
    if (TC.stickId == null) {
      for (let i = 0; i < live.length; i++) {
        const t = live[i];
        if (t.pressed && t.startX < W / 2 && !inside(t.startX, t.startY, TC.pause.x, TC.pause.y, TC.pause.s, TC.pause.s)) {
          TC.stickId = t.id; TC.ox = t.startX; TC.oy = t.startY; break;
        }
      }
    }
    TC.kx = TC.ky = 0;
    if (TC.stickId != null) {
      const t = live.find(q => q.id === TC.stickId);
      if (t) {
        const dx = t.x - TC.ox, dy = t.y - TC.oy, d = Math.sqrt(dx * dx + dy * dy);
        if (d > 5) { const m = Math.min(1, (d - 5) / (R_ - 5)); TC.kx = dx / d * m; TC.ky = dy / d * m; }
      }
      I.setStick(TC.kx, TC.ky);
    }
    // action buttons
    TC.btns.forEach(b => {
      const down = live.some(t => t.id !== TC.stickId && dist(t.x, t.y, b.x, b.y) <= b.r + 8);
      if (down !== !!TC.held[b.a]) { TC.held[b.a] = down; I.setVirtual(b.a, down); }
      SC.circle(b.x, b.y, b.r, down ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.16)', true);
      SC.circle(b.x, b.y, b.r, 'rgba(255,255,255,0.55)', false);
      icon(b.ic, b.x - 5, b.y - 5, '#ffffff', 0.85);
    });
    // pause
    const pz = TC.pause;
    const pd = live.some(t => t.pressed && inside(t.x, t.y, pz.x, pz.y, pz.s, pz.s));
    if (pd !== TC.pauseHeld) { TC.pauseHeld = pd; I.setVirtual('pause', pd); }
    SC.rect(pz.x, pz.y, pz.s, pz.s, 'rgba(0,0,0,0.35)');
    icon('ic_pause', pz.x + 4, pz.y + 4, '#ffffff', 0.85);
    // stick visual

  SC.fx.ring(cx, cy, { color: '#ffe14a', r0: 4, r1: 140, life: 20, thick: 3 });
  SC.fx.flash('#fff2a0', 6, 0.5);
  stampText('CRITICAL!', '#ffe14a', { prio: 3, base: 5, shadow: DARK });
  addScore(500, cx, cy - 34, null, 2); addCombo(2);
  run.stats.dives++; hintDone('dive'); missions.event('dive');
  if (e.hp <= 0) startBossDeath(e);
}

/* thorns */
function updateThorns(dt) {
  for (const t of thorns) {
    t.life -= dt;
    for (const e of enemies) {
      if (e.dead || e.dying || t.hit[e.id]) continue;
      if (SC.collideCircle(enemyRef(e), t.x, t.y, 7)) { t.hit[e.id] = true; damageEnemy(e, 1, 'thorn'); }
    }
  }
  thorns = thorns.filter(t => t.life > 0);
}

/* ------------------------------------------------------------------ pickups and coins */
function spawnPickup(x, y, type) {
  if (pickups.length >= 4) return;
  if (!type) {
    type = pick(PU_TYPES, P);
    if (type === 'heart' && p.hp >= p.maxhp) type = 'rockets';
  }
  pickups.push({ type, x: clamp(x, 20, W - 20), by: clamp(y, 44, SC.groundY - 40), rise: 2, age: 0, life: 720 });
}
function updatePickups(dt) {
  const cref = catRef();
  for (const u of pickups) {
    u.age += dt; u.rise = M.max(0, u.rise - 0.04 * dt); u.by -= u.rise * dt;
    u.by = M.max(u.by, 40);
    u.y = u.by + M.sin(u.age * 0.08) * 4;
    if (u.age > u.life) u.dead = true;
    if (hyp(u.x - p.x, u.y - p.y) < 16 || SC.collide(cref, refC('pu_' + u.type, 0, u.x, u.y, false))) { u.dead = true; collectPickup(u); }
  }
  pickups = pickups.filter(u => !u.dead);
}
function collectPickup(u) {
  sfx('powerup');
  SC.fx.ring(u.x, u.y, { color: '#ffffff', r0: 4, r1: 36, life: 14, thick: 2 });
  SC.fx.burst(u.x, u.y, { n: 10, colors: ['#ffffff', '#ffe14a', '#4de8ff'], speed: 2.4, life: 22 });
  const label = { shield: 'SHIELD', slow: 'SLOW', magnet: 'MAGNET', rockets: '+ROCKETS', heart: '+HEART', star: 'X2 SCORE' }[u.type];
  SC.fx.popup(label, u.x, u.y - 12, { color: '#ffffff', life: 44 });
  switch (u.type) {
    case 'shield': p.shieldT = TUNE.shieldPuFrames; break;
    case 'slow': run.t.slow = TUNE.slowFrames; break;
    case 'magnet': run.t.magnet = TUNE.magnetFrames; break;
    case 'rockets': p.ammo = M.min(M.max(ammoMax(), TUNE.ammoHardCap), p.ammo + TUNE.ammoPickup); break;
    case 'heart': if (p.hp < p.maxhp) p.hp++; else addScore(200, u.x, u.y - 22); break;
    case 'star': run.t.star = TUNE.starFrames; break;
  }
}
function updateCoins(dt) {
  const mr = magnetR();
  for (const c of coinsL) {
    c.age += dt;
    const d = hyp(p.x - c.x, p.y - c.y);
    const pulled = run.phase !== 'dying' && ((run.vac && c.age > 6) || (c.age > 20 && d < mr));
    if (pulled) {
      const l = d || 1, pull = run.vac ? 9 : M.min(7, 1.4 + (mr - d) / mr * 4);
      c.vx += (p.x - c.x) / l * 0.5 * dt; c.vy += (p.y - c.y) / l * 0.5 * dt;
      const sp = hyp(c.vx, c.vy); if (sp > pull + 3) { c.vx *= (pull + 3) / sp; c.vy *= (pull + 3) / sp; }
      c.grounded = false; c.mag = true;
    } else {
      c.mag = false;   // left the magnet range: falls again
      c.vy += 0.12 * dt;
    }
    c.x += c.vx * dt; c.y += c.vy * dt;
    if (!c.mag) {
      c.vx *= 0.985;
      if (c.y > SC.groundY - 4) { c.y = SC.groundY - 4; c.vy *= -0.4; if (M.abs(c.vy) < 0.4) c.vy = 0; c.vx *= 0.8; }
    }
    c.x = clamp(c.x, 4, W - 4);
    if (d < 13 && run.phase !== 'dying') {
      c.dead = true; run.coins++; missions.event('coins');
      const ch = run.coinChain || 0;
      sfx('coin', { pitch: 1 + M.min(ch, run.vac ? 18 : 8) * (run.vac ? 0.04 : 0.05), vol: 0.6 });
      run.coinChain = ch + 1; run.coinChainT = run.vac ? 30 : 20;
      SC.fx.burst(c.x, c.y, { n: 2, colors: ['#ffe14a', '#ffffff'], speed: 1, life: 8 });
    }
    if (c.age > 900) c.dead = true;
  }
  run.coinChainT = (run.coinChainT || 0) - dt; if (run.coinChainT <= 0) run.coinChain = 0;
  coinsL = coinsL.filter(c => !c.dead);
}

/* ------------------------------------------------------------------ waves */
const COST = { tank_light: 1, drone: 1, tank_heavy: 3, artillery: 2.5, heli: 3.5, boss: 0 };
function genQueue(n, budgetOverride) {
  const q = [];
  if (n % 5 === 0 && budgetOverride == null) {
    q.push('boss');
    const k = 2 + M.floor(n / 5);
    for (let i = 0; i < k; i++) q.push(Q() < 0.6 ? 'tank_light' : 'drone');
    return q;
  }
  if (budgetOverride == null) {
    if (n === 1) return ['tank_light', 'tank_light'];
    if (n === 2) return ['tank_light', 'tank_light', 'tank_light', 'tank_light'];
    if (n === 3) return ['tank_light', 'tank_light', 'tank_heavy'];
    if (n === 4) return ['tank_light', 'drone', 'drone', 'tank_light', 'artillery'];
  }
  let budget = budgetOverride != null ? budgetOverride : 4 + n * 2.3;
  const opts = [['tank_light', 3]];
  if (n >= 3) { opts.push(['drone', 1.5], ['tank_heavy', 1.5 + (n - 3) * 0.2]); }
  if (n >= 4) opts.push(['artillery', 1]);
  if (n >= 5) opts.push(['heli', 1.2]);
  let guard = 40;
  while (budget >= 1 && guard-- > 0) {
    const av = opts.filter(o => COST[o[0]] <= budget + 0.01);
    if (!av.length) break;
    let tot = 0; av.forEach(o => (tot += o[1]));
    let r = Q() * tot, ch = av[0][0];
    for (const o of av) { r -= o[1]; if (r <= 0) { ch = o[0]; break; } }
    q.push(ch); budget -= COST[ch];
  }
  return q;
}
function biomeFor(n) {
  const idx = M.floor((n - 1) / 5), o = run.biomeOrder;
  while (o.length <= idx) {
    const perm = [0, 1, 2, 3, 4];
    for (let i = 4; i > 0; i--) { const j = M.floor(run.biomeRng() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
    if (o.length && perm[0] === o[o.length - 1]) { const t = perm[0]; perm[0] = perm[1]; perm[1] = t; }
    for (let i = 0; i < 5; i++) o.push(perm[i]);
  }
  return o[idx];
}

function startWave(n) {
  run.waveCoins0 = run.coins; run.wave = n; run.phase = 'fight'; run.phaseT = 0; run.waveT = 0; run.hurtInWave = false; run.vac = false;
  run.queue = genQueue(n);
  run.spawnT = n === 1 ? 70 : 50;
  const nb = biomeFor(n);
  if (nb !== run.biome) { run.prevBiome = run.biome; run.biome = nb; run.blend = 0; }
  if (up('shield')) p.waveShield = true;
  const rg = up('regen');
  if (rg && n > 1 && (n - 1) % M.max(1, 3 - rg) === 0 && p.hp < p.maxhp) { p.hp++; SC.fx.popup('+1 HP', p.x, p.y - 20, { color: '#ff5a7a' }); }
  missions.event('wave', n);
  const st = getStats();
  if (n > st.bestWave) { st.bestWave = n; SC.store.set('stats', st); }
  checkGoal();
  const boss = n % 5 === 0;
  const ls = [{ t: 'WAVE ' + n, s: boss ? 3 : 4, c: boss ? '#ff7a7a' : '#ffffff' }];
  if (boss) ls.push({ t: 'MEGA TANK', s: 2, c: '#ffe14a' });
  if (n === 1 && run.goal) ls.push({ t: 'GOAL: ' + run.goal.text, s: 1, c: '#4de8ff' });
  bannerSet(ls, boss ? 56 : 95);
  sfx(boss ? 'boss_warn' : 'wave_start');
  if (SC.music) SC.music.play(boss ? 'boss' : 'battle');
}
function aliveNonDying() { return enemies.filter(e => !e.dead).length; }

function updateWave(dt) {
  run.waveT += dt;
  if (run.phase === 'fight') {
    if (run.waveT > 55) {
      run.spawnT -= dt;
      const boss = run.wave % 5 === 0;
      const cap = boss ? 4 : M.min(11, 3 + M.floor(run.wave / 2));
      const alive = aliveNonDying();
      if (alive === 0 && run.queue.length && run.spawnT > 20) run.spawnT = 20;
      if (run.spawnT <= 0 && run.queue.length && alive < cap) {
        const t = run.queue[0];
        if (t !== 'boss' && boss && run.bossAlive && alive >= 3) { run.spawnT = 20; }
        else {
          run.queue.shift(); spawnEnemy(t);
          run.spawnT = (t === 'boss' ? 140 : M.max(30, 110 - run.wave * 6)) * (boss ? 1.6 : 1);
        }
      }
    }
    checkGoal();
    if (!run.queue.length && enemies.length === 0 && run.waveT > 60) waveClear();
  } else if (run.phase === 'clear') {
    run.phaseT += dt;
    if (run.phaseT > 85) {
      openDraft();
    }
  }
}
function waveClear() {
  run.phase = 'clear'; run.phaseT = 0; run.vac = true; run.coinChain = 0;
  bannerSet([{ t: 'WAVE CLEAR', s: 4, c: '#ffe14a' }], 85);
  sfx('wave_clear'); SC.fx.flash('#ffffff', 4, 0.25); shake(3, 8);
  addScore(100 * run.wave, p.x, p.y - 22, 'CLEAR');
  SC.fx.popup('+' + (run.coins - (run.waveCoins0 || 0)) + ' COINS', p.x, p.y - 56, { color: '#ffe14a', life: 70 });
  if (run.wave % 5 === 0) { spawnPickup(W / 2, 120, 'heart'); }
  // SWIFT: beat the par time for a flat bonus
  const par = TUNE.swiftPar + run.wave * TUNE.swiftPerWave;
  if (run.waveT < par) {
    const bonus = M.round((par - run.waveT) * 2);
    run.score += bonus; run.coins += 10;
    addCoinBurst(p.x, p.y - 20, 5);
    SC.fx.popup('SWIFT +' + bonus, p.x, p.y - 44, { color: '#4de8ff', life: 60 });
    stampText('SWIFT!', '#4de8ff', { prio: 2, base: 4, life: 50, shadow: DARK });
  }
  if (run.goal && !run.goal.done && run.goal.kind === 'nodmg' && run.wave === run.goal.target && !run.hurtInWave) {
    run.goal.done = true; run.coins += TUNE.goalCoins;
    stampText('GOAL DONE!', '#4de8ff', { prio: 3, base: 4 });
    SC.fx.popup('+' + TUNE.goalCoins + ' COINS', p.x, p.y - 30, { color: '#ffe14a', life: 60 });
  }
  checkGoal();
  bankCoins();
}

/* ------------------------------------------------------------------ draft */
function openDraft() {
  const pool = UP_IDS.filter(id => up(id) < UPS[id].max);
  const rnd = M.random;
  const offers = [];
  while (offers.length < 3 && pool.length) offers.push(pool.splice(M.floor(rnd() * pool.length) % pool.length, 1)[0]);
  if (!offers.length) { startWave(run.wave + 1); return; }
  run.draft = offers; run.draftT = 0; run.phase = 'draft';
  if (SC.ui.resetFocus) SC.ui.resetFocus();
  sfx('select');
}
function applyUpgrade(id) {
  run.up[id] = up(id) + 1;
  switch (id) {
    case 'maxhp': p.maxhp++; p.hp = M.min(p.maxhp, p.hp + 2); break;
    case 'ammo': p.ammo = M.min(ammoMax() + 3, p.ammo + 1); break;
    case 'shield': p.waveShield = true; break;
  }
  sfx('confirm'); SC.fx.ring(p.x, p.y, { color: '#ffe14a', r0: 4, r1: 60, life: 18, thick: 2 });
  SC.fx.popup(UPS[id].title, p.x, p.y - 24, { color: '#ffe14a', life: 60 });
  run.draft = null;
  startWave(run.wave + 1);
}
function drawDraft() {
  SC.rect(0, 0, W, H, 'rgba(8,10,24,0.72)');
  T('CHOOSE AN UPGRADE', W / 2, 26, { scale: 2, align: 'center', color: '#ffe14a', wave: 1 });
  T('WAVE ' + run.wave + ' CLEARED', W / 2, 48, { align: 'center', color: '#ffffff' });
  const cw = 130, ch = 150, gap = 14, total = cw * 3 + gap * 2, x0 = (W - total) / 2, y0 = 70;
  const ready = run.draftT > TUNE.draftGuard;
  for (let i = 0; i < run.draft.length; i++) {
    const id = run.draft[i];
    const k = clamp((run.draftT - i * 5) / TUNE.draftAnim, 0, 1);
    const ww = M.max(4, M.round(cw * M.abs(M.cos((1 - SC.ease.outCubic(k)) * PI / 2))));
    const cx = x0 + i * (cw + gap) + cw / 2;
    const lv = up(id);
    const picked = SC.ui.card('card' + i, M.round(cx - ww / 2), y0, ww, ch,
      { title: UPS[id].title, desc: UPS[id].desc, icon: 'up_' + id, accent: ['#ff9a2e', '#4de8ff', '#ff5fb0'][i],
        level: lv > 0 ? 'LV ' + lv + ' > ' + (lv + 1) : 'NEW' });
    // guard against a stray press (a held Space from dashing counts as confirm for the first second)
    const spaceHeld = run.draftT < TUNE.draftSpaceGuard && SC.input.down('dash');
    if (picked && ready && !spaceHeld) { applyUpgrade(id); return; }
  }
  if (ready) { T('PICK WITH MOUSE OR TOUCH, OR', W / 2 - 40, 240, { align: 'center', color: '#aab' }); SC.ui.prompt(W / 2 + 76, 238, 'confirm', 'PICK'); }
}

/* ------------------------------------------------------------------ end of run */
function bankCoins() {
  const tot = run.coins + missions.bonus;
  const d = tot - run.banked;
  if (d !== 0) { SC.store.set('coins', (SC.store.get('coins', 0) || 0) + d); run.banked = tot; }
  return tot;
}
// idempotent: coins, stats, best score is saved whenever a run ends or is left
function saveRun() {
  if (!run) return 0;
  const total = bankCoins();
  const st = getStats(), sb = run.statsB;
  st.kos += run.stats.kos - sb.kos; st.parries += run.stats.parries - sb.parries; st.dives += run.stats.dives - sb.dives;
  sb.kos = run.stats.kos; sb.parries = run.stats.parries; sb.dives = run.stats.dives;
  if (!run.counted) { run.counted = true; st.runs += 1; }
  if (run.wave > st.bestWave) st.bestWave = run.wave;
  SC.store.set('stats', st);
  const prev = SC.store.get(run.bestKey, 0) || 0;
  if (run.score > prev) SC.store.set(run.bestKey, run.score);
  return total;
}
function dayStreak() {
  const s = SC.store.get('streak', null) || { n: 0, last: '' };
  let bonus = 0;
  if (s.last !== run.date) {
    s.n = s.last === utcYesterday(run.date) ? (s.n || 0) + 1 : 1;
    s.last = run.date;
    bonus = 20 + 10 * M.min(s.n, 10);
    SC.store.set('streak', { n: s.n, last: s.last });
    SC.store.set('coins', (SC.store.get('coins', 0) || 0) + bonus);
  }
  return { bonus, day: s.n };
}
function finishRun() {
  if (run.over) return;
  run.over = true;
  const newBest = run.score > run.bestBefore;
  const total = saveRun();
  const sk = dayStreak();
  if (newBest) sfx('newbest');
  const res = { mode: run.mode, score: run.score, wave: run.wave, kos: run.kos,
    maxCombo: run.maxCombo, coins: total, best: M.max(run.bestBefore, run.score), newBest, missionsDone: missions.done.slice(), time: M.round(run.f / 60),
    streakBonus: sk.bonus, streakDay: sk.day, goal: run.goal ? { text: run.goal.text, done: !!run.goal.done } : null,
    bestBefore: run.bestBefore };
  try {
    const h = SC.store.get('history', []) || [];
    h.unshift({ t: Date.now(), score: run.score, wave: run.wave, kos: run.kos, coins: total, time: res.time, skin: run.skin });
    SC.store.set('history', h.slice(0, 50));
  } catch (err) {}
  let rank = null;
  try {
    if (SC.net && SC.net.submit) rank = SC.net.submit({ mode: 'endless', score: run.score, wave: run.wave, kos: run.kos, time: M.round(run.f / 60) });
  } catch (err) { rank = null; }
  res.rank = rank;
  SC.go('results', res);
}
/* ------------------------------------------------------------------ pause */
function setPaused(v) {
  run.paused = v;
  if (SC.ui.resetFocus) SC.ui.resetFocus();
  if (SC.music) SC.music.duck(v ? 60 * 3600 : 1);   // lower the music while paused, restore on resume
}
function doPause() {
  if (run.paused || run.over || run.phase === 'dying') return;
  setPaused(true);
  sfx('select');
}
function onBlur() { if (run && !(SC.flags && SC.flags.test)) doPause(); }
function onVis() { if (document.hidden) onBlur(); }
function leaveRun(next) { saveRun(); if (SC.music) SC.music.duck(1); if (next === 'restart') SC.go('play', { mode: 'endless' }); else SC.go('title'); }
function drawPause() {
  SC.rect(0, 0, W, H, 'rgba(8,10,24,0.75)');
  T('PAUSED', W / 2, 62, { scale: 4, align: 'center', color: '#ffffff' });
  const bx = W / 2 - 60;
  if (SC.ui.button('p_resume', bx, 110, 120, 24, 'RESUME', { icon: 'ic_play' })) { setPaused(false); sfx('confirm'); }
  if (SC.ui.button('p_restart', bx, 140, 120, 24, 'RESTART', { icon: 'ic_retry' })) leaveRun('restart');
  if (SC.ui.button('p_quit', bx, 170, 120, 24, 'QUIT', { icon: 'ic_home' })) leaveRun('title');
  let hx = W / 2 - 100;
  hx += SC.ui.prompt(hx, 210, 'pause', 'RESUME') + 14;
  SC.ui.prompt(hx, 210, 'retry', 'RESTART');
}

/* ------------------------------------------------------------------ hints (onboarding) */
function updateHints(dt) {
  const h = run.hints;
  run.hint = null;
  if (run.phase !== 'fight' || run.over) return;
  if (!h.parry) {
    for (const s of shots) if (!s.fr && !s.dead && s.k !== 'mortar' && hyp(s.x - p.x, s.y - p.y) < 70) { run.hint = 'parry'; break; }
  }
  if (!run.hint && !h.dive && enemies.some(e => e.kind === 'tank' && !e.dying && !e.dead)) run.hint = 'dive';
  if (!run.hint && h.dive && h.parry && !h.rocket && run.hintRocketT < 420 && enemies.length) { run.hint = 'rocket'; run.hintRocketT += dt; }
}

/* ------------------------------------------------------------------ update */
function updateFxLists(dt, rawDt) {
  for (const l of lines) l.age += rawDt;
  lines = lines.filter(l => l.age < l.life);
  for (const t of trail) t.life -= dt;
  trail = trail.filter(t => t.life > 0);
  for (const a of afters) a.life -= dt;
  afters = afters.filter(a => a.life > 0);
  for (const a of anims) a.f += dt / a.sp;
  anims = anims.filter(a => a.f < (si(a.name, 8, 8).count || 1));
  for (const s of smokes) { s.f += dt * 0.12; s.y += s.vy * dt; }
  smokes = smokes.filter(s => s.f < (si('smoke', 8, 8).count || 1));
  for (const f of flyers) { f.vy += 0.25 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.a += f.spin * dt; f.life -= dt; if (f.y > SC.groundY) { f.y = SC.groundY; f.vy *= -0.4; f.vx *= 0.7; f.spin *= 0.6; } }
  flyers = flyers.filter(f => f.life > 0);
  for (const s of sils) s.life -= dt;
  sils = sils.filter(s => s.life > 0);
  if (run.stamp) { run.stamp.t += rawDt; if (run.stamp.t > run.stamp.life) run.stamp = null; }
  if (run.banner) { run.banner.t += rawDt; if (run.banner.t > run.banner.life) run.banner = null; }
  if (run.sub) { run.sub.t += rawDt; if (run.sub.t > run.sub.life) run.sub = null; }
  if (run.trick) { run.trick.t += rawDt; if (run.trick.t > run.trick.life) run.trick = null; }
  if (run.warn) { run.warn.t += rawDt; if (run.warn.t > run.warn.life) run.warn = null; }
}

function update() {
  const inp = SC.input, raw = SC.dt;
  if (run.over) return;
  if (run.paused) {
    if (inp.pressed('pause') || inp.pressed('back')) { setPaused(false); sfx('back'); }
    else if (inp.pressed('retry')) leaveRun('restart');
    return;
  }
  if (inp.pressed('pause')) { doPause(); return; }

  if (run.phase === 'draft') { run.draftT += raw; return; }

  const dying = run.phase === 'dying';
  const dtW = raw * (dying ? 0.3 : 1);
  const dtE = dtW * (run.t.slow > 0 ? 0.5 : 1);
  run.f += raw; run.parryFx -= raw; run.grazeSfx -= raw;
  run.scroll += (1.1 + (p.dashT > 0 ? 1.5 : 0)) * dtW;
  if (run.blend < 1) run.blend = M.min(1, run.blend + dtW / 150);
  if (run.t.slow > 0) run.t.slow -= dtW;
  if (run.t.magnet > 0) run.t.magnet -= dtW;
  if (run.t.star > 0) run.t.star -= dtW;

  // combo decay: holds during clear / banner / draft and while the field is empty waiting for spawns
  if (run.combo > 0 && !dying) {
    const hold = run.phase !== 'fight' || (enemies.length === 0 && run.queue.length > 0);
    if (!hold) {
      run.comboT -= dtW;
      if (run.comboT <= 0) breakCombo();
    }
  }

  if (!dying) {
    updateWave(dtW);
    // periodic pickup spawns
    run.puT -= dtW;
    if (run.puT <= 0) { run.puT = 900 + P() * 700; if (pickups.length < 2) spawnPickup(60 + P() * (W - 120), 70 + P() * 110); }
  }
  if (run.phase === 'banner') startWave(1);

  updatePlayer(dtW);
  updateEnemies(dtE, dtW);
  updateRockets(dtW);
  updateShots(dtE, dtW);
  if (!dying) playerVsEnemies();
  updateThorns(dtW);

        queueList: run.queue.slice(), hint: run.hint, goal: run.goal ? Object.assign({}, run.goal) : null,
        stamp: run.stamp ? run.stamp.text : null, banner: run.banner ? run.banner.lines.map(l => l.t) : null,
        player: { x: p.x, y: p.y, vx: p.vx, vy: p.vy, face: p.face, dash: p.dashT > 0, parry: p.parryT >= 0, inv: p.inv, shield: hasShield() },
        enemies: enemies.map(e => ({ type: e.type, x: e.x, y: e.y, w: e.w, h: e.h, hp: e.hp, stun: e.stun, tele: e.tele, hOpen: e.hOpen, ready: e.bossReady })),
        rocketList: rockets.map(r => ({ x: r.x, y: r.y, ang: r.ang, sp: r.sp })),
        shots: shots.map(s => ({ k: s.k, x: s.x, y: s.y, fr: s.fr })), rockets: rockets.length, pickups: pickups.length
      };
    },
    spawn(type, x) { return spawnEnemy(type, x); },
    skipWave() {
      run.queue.length = 0;
      for (const e of enemies.slice()) { e.hp = 0; if (e.type === 'boss') { e.dying = true; e.dyingT = 109; e.bossReady = true; } else koEnemy(e, 'chain'); }
      if (run.phase === 'fight') { run.waveT = M.max(run.waveT, 61); }
    },
    pick(i) { if (run.phase === 'draft' && run.draft) applyUpgrade(run.draft[i || 0]); },
    setPlayer(x, y) { p.x = x; p.y = y; p.vx = 0; p.vy = 0; },
    give(id) { applyUpgrade2(id); },
    pickup(type, x, y) { spawnPickup(x || p.x + 40, y || p.y, type); }
  };
}
function applyUpgrade2(id) { if (!UPS[id]) return; const d = run.draft; run.draft = null; const ph = run.phase; run.up[id] = up(id) + 1; if (id === 'maxhp') { p.maxhp++; p.hp = M.min(p.maxhp, p.hp + 2); } if (id === 'shield') p.waveShield = true; run.draft = d; run.phase = ph; }

})();

</script>
<script>
// Sky Cat entry: start the requested scene (default boot), then run the loop.
(function () {
  'use strict';
  const SC = window.SC;
  let scene = SC.flags.scene || 'boot';
  if (!SC.hasScene(scene)) scene = 'boot';
  SC.go(scene, scene === 'play' ? { mode: 'endless' } : {});
  SC.run();
})();

</script>
