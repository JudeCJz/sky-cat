function drawPixelText(c,text,x,y,scale=1){text=String(text).toUpperCase();const width=Math.max(0,text.length*4-1)*scale;if(c.textAlign==='center')x-=width/2;else if(c.textAlign==='right')x-=width;const top=Math.round(y-5*scale);for(let i=0;i<text.length;i++){const rows=(FONT[text[i]]||FONT['?']).split('/');for(let ry=0;ry<5;ry++)for(let rx=0;rx<3;rx++)if(rows[ry][rx]==='1')c.fillRect(Math.round(x+i*4*scale+rx*scale),top+ry*scale,scale,scale)}}
function paintPixelLabel(canvas,text,scale=2,ink=PAL.cream,button=false){const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;const tw=text.length*4-1,pad=button?6:0;canvas.width=(tw+pad*2)*scale;canvas.height=(button?18:5)*scale;const x=canvas.width/scale,y=canvas.height/scale;if(button){c.fillStyle='#253047';c.fillRect(0,0,x,y);c.fillStyle='#536d78';c.fillRect(0,0,x,2);c.fillStyle='#17243a';c.fillRect(0,y-2,x,2);c.fillStyle=ink;drawPixelText(c,text,pad,y-4,scale)}else{c.fillStyle=ink;drawPixelText(c,text,0,5,scale)}canvas.style.width=canvas.width+'px';canvas.style.height=canvas.height+'px';canvas.setAttribute('aria-hidden','true')}

function makeCatPose(pose='fly',phase=0){const w=17,h=14,g=Array.from({length:h},()=>Array(w).fill('.')),ranges=[[5,11],[4,12],[3,13],[2,14],[2,15],[2,15],[3,15],[4,14],[3,13],[2,12],[3,12],[4,6],[4,6]];for(let y=0;y<ranges.length;y++)for(let x=ranges[y][0];x<=ranges[y][1];x++)g[y][x]='C';for(let x=10;x<=12;x++){g[11][x]='C';g[12][x]='C'}

for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(g[y][x]==='C'&&([[x-1,y],[x+1,y],[x,y-1],[x,y+1]].some(([xx,yy])=>!g[yy]||g[yy][xx]==='.')))g[y][x]='K';
for(const [x,y,c] of [[8,5,'B'],[12,5,'B'],[9,5,'W'],[13,5,'W'],[10,7,'P'],[11,7,'P'],[8,8,'P'],[9,8,'P'],[10,8,'P'],[11,8,'P']])put(x,y,c);

const skinSets=[{name:'Cloud Kitty',C:'#f4efcf',K:'#253047',P:'#ed827b',B:'#253047',Y:'#ffe477'},{name:'Tiger Jet',C:'#f39b52',K:'#253047',P:'#f4efcf',B:'#253047',Y:'#ffe477'},{name:'Moon Cat',C:'#a9b8ee',K:'#30365f',P:'#f29bc3',B:'#30365f',Y:'#ffe477'},{name:'Moss Paws',C:'#91bb72',K:'#263c38',P:'#d48c68',B:'#263c38',Y:'#ffe477'}];
let state='menu',mode='survival',skin=0,score=0,best=0,frame=0,timeLeft=60,elapsed=0,health=3,dashCd=0,dashTime=0,parryTime=0,parryCd=0,shieldTime=0,slowTime=0,multTime=0,rocketCd=0,shootTime=0,parryFX=0,parryPending=false,spawnClock=0,shotClock=0,biome=0,day=0,runSeed=1,rngState=1,ghost=[],ghostRun=[],dailyBest=0,unlocked=[0],keys={},touchTarget=null,paused=false, audioOn=false,audioCtx=null;

const BIOMES=[{name:'CLOUD FIELDS',sky:'#78c9d4',far:'#87b98b',ground:'#795b50',grass:'#76a85c'},{name:'DUSK DESERT',sky:'#dc9b77',far:'#aa795f',ground:'#604d48',grass:'#c18a59'},{name:'MOON BASE',sky:'#39486c',far:'#65708b',ground:'#3f4653',grass:'#a6a6a1'},{name:'JUNGLE SKY',sky:'#5ba99a',far:'#477c65',ground:'#574f40',grass:'#83a957'}];
function load(k,d){try{const v=localStorage.getItem('sc-'+k);return v===null?d:JSON.parse(v)}catch{return d}}function save(k,v){try{localStorage.setItem('sc-'+k,JSON.stringify(v))}catch{}}

function rand(){rngState=(rngState*1664525+1013904223)>>>0;return rngState/4294967296}function fxRand(){return Math.random()}function setSeed(n){rngState=n>>>0||1}function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}
function gridFor(type,variant=0){if(type==='cat')return catFrame;const frames=SPRITES[type];return frames?frames[variant%frames.length]:[]}
function colorsFor(type,variant=0){if(type==='cat'){const s=skinSets[variant%skinSets.length];return{'.':null,K:s.K,C:s.C,P:s.P,B:s.B,Y:s.Y,W:PAL.white,S:PAL.shadow}}return{'.':null,G:PAL.tank2,D:PAL.dark,R:PAL.red,Y:PAL.gold,C:PAL.cyan,P:PAL.pink}}
function drawSprite(type,x,y,scale=2,variant=0,alpha=1,frame=0){const g=type==='tank'?tankGrid():gridFor(type,type==='cat'?variant:frame),colors=colorsFor(type,variant);ctx.save();ctx.globalAlpha=alpha;for(let r=0;r<g.length;r++)for(let c=0;c<g[r].length;c++){const col=colors[g[r][c]];if(col)px(x+c*scale,y+r*scale,scale,scale,col)}ctx.restore()}
// Precise opaque-pixel overlap in the same grid used to render each sprite.
function maskHit(a,ag,b,bg){for(let ay=0;ay<ag.length;ay++)for(let ax=0;ax<ag[ay].length;ax++){if(ag[ay][ax]==='.')continue;const x=a.x+ax*a.scale,y=a.y+ay*a.scale;for(let by=Math.max(0,Math.floor((y-b.y)/b.scale));by<Math.min(bg.length,Math.ceil((y+a.scale-b.y)/b.scale));by++)for(let bx=Math.max(0,Math.floor((x-b.x)/b.scale));bx<Math.min(bg[by].length,Math.ceil((x+a.scale-b.x)/b.scale));bx++){if(bg[by][bx]==='.')continue;const xx=b.x+bx*b.scale,yy=b.y+by*b.scale;if(x<xx+b.scale&&x+a.scale>xx&&y<yy+b.scale&&y+a.scale>yy)return true}}return false}
function sweepHit(x0,y0,x1,y1,grid,scale,target,targetGrid){const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/Math.max(1,scale)));for(let i=0;i<=n;i++){const u=i/n;if(maskHit({x:Math.round(x0+(x1-x0)*u),y:Math.round(y0+(y1-y0)*u),scale},grid,target,targetGrid))return true}return false}

function addButton(text,fn,disabled=false){const b=document.createElement('button');b.className='btn';b.setAttribute('aria-label',text);b.disabled=disabled;const art=document.createElement('canvas');paintPixelLabel(art,text,2,PAL.cream,true);b.appendChild(art);b.addEventListener('click',fn);controls.appendChild(b);return b}
function menuUI(){controls.replaceChildren();if(state==='menu'){addButton('ENDLESS CHASE',()=>start('survival'));addButton('60-SECOND ASSAULT',()=>start('timed'));addButton('DAILY MISSION',()=>start('daily'));addButton('CAT SKINS',skinMenu);addButton(audioOn?'SOUND: ON':'SOUND: OFF',toggleSound);say('Best: '+best+'  •  Daily best: '+dailyBest)}else if(state==='over'||state==='won'){addButton('PLAY AGAIN',()=>start(mode));addButton('CHANGE MODE',()=>{state='menu';menuUI()});addButton('SHARE SCORE',shareScore);addButton('CAT SKINS',skinMenu);say(state==='won'?'MISSION COMPLETE! TANKS TOPPLED: '+score:'RUN OVER · TANKS TOPPLED: '+score+' · BEST: '+best)}else if(state==='play'){addButton('DASH (SPACE)',dash);addButton('PARRY (E)',parry,parryCd>0);addButton('BAZOOKA (F)',fireBazooka,rocketCd>0);addButton(paused?'RESUME':'PAUSE',()=>{paused=!paused});addButton(audioOn?'SOUND: ON':'SOUND: OFF',toggleSound);say(mode==='daily'?'DAILY MISSION · '+dailyObjective+' TANKS':mode==='timed'?'TIME LEFT: '+Math.ceil(timeLeft)+'s':'TANKS TOPPLED: '+score+'  ·  DASH: '+(dashCd<=0?'READY':dashCd.toFixed(1)+'s'))}}

function update(dt){if(state!=='play'||paused)return;elapsed+=dt;frame++;dashCd=Math.max(0,dashCd-dt);dashTime=Math.max(0,dashTime-dt);parryTime=Math.max(0,parryTime-dt);parryCd=Math.max(0,parryCd-dt);missCd=Math.max(0,missCd-dt);shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);for(const p of popups){p.y-=dt*18;p.life-=dt}popups=popups.filter(p=>p.life>0);shieldTime=Math.max(0,shieldTime-dt);slowTime=Math.max(0,slowTime-dt);multTime=Math.max(0,multTime-dt);player.invuln=Math.max(0,player.invuln-dt);timeLeft-=dt;

 const slow=slowTime>0?.55:1;spawnClock-=dt;if(spawnClock<=0){spawnTank();spawnClock=Math.max(.85,2.3-score*.018)}shotClock-=dt;if(shotClock<=0){spawnPickup();shotClock=9+rand()*4}

}

function drawTank(t){const k=t.dead?t.ko:0,ox=t.x+(t.dead?Math.sin(t.ko*85)*(1-t.ko/.42)*3:0),oy=t.y-(t.dead?k*16:0);drawSprite('tank',ox,oy,2,0,t.dead?Math.max(0,1-k/.42):1);if(!t.dead){px(t.x+20,t.y+4,6,6,Math.sin(frame*.35)>0?PAL.gold:'#d9a846');px(t.x+22,t.y+6,2,2,PAL.cream);if(t.warning>0){pixelLine(t.x+7,t.y+8,player.x+17,player.y+14,'#ffe477',5);px(t.x+3,t.y-4,8,2,PAL.red)}}}
function draw(){ctx.save();if(shake>0)ctx.translate(Math.round(Math.sin(frame*91)*shake*15),Math.round(Math.cos(frame*67)*shake*9));drawBg();if(ghost.length&&state==='play'){const g=ghost[Math.floor((elapsed*30)%ghost.length)];if(g)drawSprite('cat',g[0],g[1],2,skin,.2)}for(const t of tanks)drawTank(t);for(const b of bolts){px(b.x-b.vx*2,b.y-b.vy*2,4,2,b.reflected?PAL.cyan:PAL.red);drawSprite('bolt',b.x-2,b.y-2,2)}for(const p of pickups){drawSprite(p.type,p.x,p.y+Math.sin(p.phase)*2,2);ctx.fillStyle=PAL.ink;ctx.font='7px monospace';drawPixelText(ctx,p.type==='multi'?'2X':p.type==='slow'?'SLOW':p.type==='dash'?'DASH':p.type==='heart'?'HP':'SH',p.x-2,p.y+18)}for(const s of sparks)px(s.x,s.y,3,3,s.color||PAL.gold);if(state==='play'||state==='over'||state==='won'){if(state==='play'){px(340,165,56,17,PAL.ink);px(340,185,56,17,PAL.ink);ctx.fillStyle=PAL.cyan;ctx.font='bold 7px monospace';drawPixelText(ctx,'E PARRY',345,176);ctx.fillStyle=PAL.gold;drawPixelText(ctx,'SPACE DASH',343,196)}if(parryTime>0){for(let i=0;i<12;i++){const a=i*Math.PI/6,radius=17+(1-parryTime/.2)*5;px(player.x+17+Math.cos(a)*radius,player.y+14+Math.sin(a)*radius,2,2,PAL.cyan)}}if(!(player.invuln>0&&Math.floor(frame/4)%2))drawSprite('cat',player.x,player.y,2,skin);drawSprite('bazooka',player.x+25,player.y+12,2);ctx.fillStyle=PAL.ink;ctx.font='bold 9px monospace';drawPixelText(ctx,'TANKS '+score,8,13);drawPixelText(ctx,'HP '+('♥'.repeat(Math.max(0,health))),8,25);drawPixelText(ctx,BIOMES[biome].name,300,13);if(shieldTime>0)drawPixelText(ctx,'SHIELD '+shieldTime.toFixed(1),8,37);if(multTime>0)drawPixelText(ctx,'SCORE x2',8,49);if(mode==='timed')drawPixelText(ctx,'TIME '+Math.max(0,Math.ceil(timeLeft)),330,27);if(mode==='daily')drawPixelText(ctx,'GOAL '+dailyObjective,330,27);for(const pop of popups){ctx.globalAlpha=Math.min(1,pop.life*2);ctx.fillStyle=pop.color;ctx.textAlign='center';ctx.font='bold 10px monospace';drawPixelText(ctx,pop.text,pop.x,pop.y);ctx.globalAlpha=1;ctx.textAlign='left'}if(paused){ function pointerPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}let pointerDown=false;cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const p=pointerPos(e);if(state==='play'){pointerDown=true;touchTarget=p;if(p.x>W-62&&p.y>=H-39){pointerDown=false;touchTarget=null;dash()}else if(p.x>W-62&&p.y>=H-60){pointerDown=false;touchTarget=null;parry()}}else if(state==='menu'&&p.y>95&&p.y<135)start('survival')});cv.addEventListener('pointermove',e=>{if(pointerDown&&state==='play')touchTarget=pointerPos(e)});cv.addEventListener('pointerup',()=>{pointerDown=false;touchTarget=null});cv.addEventListener('pointercancel',()=>{pointerDown=false;touchTarget=null});
